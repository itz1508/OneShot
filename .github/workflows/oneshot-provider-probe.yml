name: OneShot provider network probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-provider-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe outbound DNS and TLS, no credentials
        shell: bash
        run: |
          python - <<'PYCODE'
          import socket,urllib.request,urllib.error
          for host in ('inference.baseten.co','api.modal.com'):
              try:
                  socket.getaddrinfo(host,443)
                  print('DNS_OK',host,flush=True)
                  try:
                      req=urllib.request.Request('https://'+host+'/',method='HEAD')
                      with urllib.request.urlopen(req,timeout=10) as resp:
                          print('HTTPS_OK',host,resp.status,flush=True)
                  except urllib.error.HTTPError as exc:
                      print('HTTPS_REACHABLE',host,exc.code,flush=True)
                  except Exception as exc:
                      print('HTTPS_FAILED',host,type(exc).__name__,flush=True)
              except Exception as exc:
                  print('DNS_FAILED',host,type(exc).__name__,flush=True)
          PYCODE

# Trigger follow-up push after workflow registration.
