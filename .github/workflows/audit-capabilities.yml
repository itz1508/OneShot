name: Research Audit Capabilities

on:
  push:
    branches: [main]
    paths:
      - "agent/audit/**"
      - "agent/reference/audit_guidance.md"
      - "tests/audit/**"
      - "mvp/**"
      - "web/**"
      - "agent/runtime/controller.py"
      - ".github/workflows/audit-capabilities.yml"
  pull_request:
    paths:
      - "agent/audit/**"
      - "agent/reference/audit_guidance.md"
      - "tests/audit/**"
      - "mvp/**"
      - "web/**"
      - "agent/runtime/controller.py"
      - ".github/workflows/audit-capabilities.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv python install 3.11
      - run: uv sync --locked --extra meta --extra mvp
      - name: Verify Audit capability fixtures
        run: uv run --no-sync pytest tests/audit -q -rs
      - name: Audit checked-out repository
        run: |
          uv run --no-sync python -m agent.audit --root . --scope . --request "Audit accepted Research integration and repository capabilities" > audit-report.json
          uv run --no-sync python -c 'import json; p=json.load(open("audit-report.json")); print("Disposition:",p["disposition"]); print("Findings:",len(p["findings"])); [print(f["code"], f["path"], f["line"]) for f in p["findings"][:80]]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-capabilities-report
          path: audit-report.json
          if-no-files-found: warn

  connected-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv python install 3.11
      - run: uv sync --locked --extra meta --extra mvp
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run connected API and browser verification
        env:
          ONESHOT_STATE_ROOT: ${{ runner.temp }}/audit-browser-state
        working-directory: web
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-connected-browser-evidence
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
