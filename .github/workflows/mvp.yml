name: MVP integration
on:
  push:
    branches: [main]
    paths:
      - 'mvp/**'
      - 'web/**'
      - 'tests/e2e/test_mvp_*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/mvp.yml'
  pull_request:
    branches: [main, feat/mvp-fastapi-react-slice]
    paths:
      - 'mvp/**'
      - 'web/**'
      - 'tests/e2e/test_mvp_*.py'
      - '.github/workflows/mvp.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv sync --locked --extra meta --extra mvp
      - run: uv run --no-sync pytest tests/e2e/test_mvp_*.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
