name: MVP integration
on:
  push:
    branches: [feat/mvp-mcp-research-adapter]
  pull_request:
    branches: [main, feat/mvp-fastapi-react-slice]
    paths:
      - 'mvp/**'
      - 'web/**'
      - 'tests/e2e/test_mvp_*.py'
      - '.github/workflows/mvp.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --extra meta
      - run: uv pip install -r mvp/requirements.txt
      - run: uv run --no-sync pytest tests/e2e/test_mvp_*.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
