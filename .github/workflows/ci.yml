name: Quality Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.python }})
    runs-on: ${{ vars.CI_RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(vars.CI_PYTHON_VERSIONS) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and development dependencies
        run: python -m pip install --editable '.[dev]'
      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.CI_TOOL_PYTHON_VERSION }}
      - name: Install project and development dependencies
        run: python -m pip install --editable '.[dev]'
      - name: Run lint
        run: make lint

  typecheck:
    name: Type check
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.CI_TOOL_PYTHON_VERSION }}
      - name: Install project and development dependencies
        run: python -m pip install --editable '.[dev]'
      - name: Run type check
        run: make typecheck
