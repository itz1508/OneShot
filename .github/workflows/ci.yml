name: CI
on:
  push:
    branches: [main, feat/mvp-mcp-research-adapter]
  pull_request:
    branches: [main, feat/mvp-mcp-research-adapter]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra meta --extra mvp
      - name: Dependency check
        run: uv run --no-sync deptry .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format check
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy agent
      - name: Validate Modal 1.6.3 ASGI image declaration (no cloud access)
        run: uv run --no-sync --with modal==1.6.3 python -c "import modal_app; assert modal_app.APP_NAME; print('Modal declaration OK')"
      - name: Tests
        run: uv run --no-sync pytest -q
