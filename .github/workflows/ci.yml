name: CI
on:
  push:
    branches: [main, feat/mvp-fastapi-react-slice]
  pull_request:
    branches: [main, feat/mvp-mcp-research-adapter]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra meta
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format check
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy agent
      - name: Tests
        run: uv run --no-sync pytest -q
