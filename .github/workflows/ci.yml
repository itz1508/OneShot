name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv lock
          uv sync --locked --extra meta
      - name: Diagnostic lockfile export (temporary)
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          value = base64.b64encode(Path('uv.lock').read_bytes()).decode()
          print('LOCKFILE_EXPORT_BEGIN')
          for i in range(0, len(value), 4000):
              print('LOCK64:' + value[i:i+4000])
          print('LOCKFILE_EXPORT_END')
          PY
      - name: Lint
        if: always()
        run: uv run --no-sync ruff check .
      - name: Format check
        if: always()
        run: |
          uv run --no-sync ruff format --diff .
          uv run --no-sync ruff format --check .
      - name: Type check
        if: always()
        run: uv run --no-sync mypy agent
      - name: Tests
        if: always()
        run: uv run --no-sync pytest -q
