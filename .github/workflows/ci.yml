name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Single source of truth: the [dev] extra in pyproject.toml.
          # It installs the project (runtime deps come with it) plus pytest,
          # pytest-cov, ruff, and mypy. No separate requirements-dev.txt.
          pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check agent/ tools/ tests/ bin/

      - name: Run tests
        run: pytest tests/ -q --tb=short

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Type-check with mypy
        run: mypy agent/ tools/ --ignore-missing-imports
