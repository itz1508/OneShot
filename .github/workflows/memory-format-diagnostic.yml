name: Memory promotion diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --extra meta
      - run: uv run --no-sync ruff format --diff agent/contracts/build_memory.py agent/runtime/memory_promotion.py tests/contracts/test_memory_promotion.py
