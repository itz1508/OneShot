name: Import clean OneShot source
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'itz1508/OneShot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract vetted local source archive
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64,io,lzma,tarfile,os
          from pathlib import Path,PurePosixPath
          p=Path('.bootstrap/source.xz.b64')
          encoded=''.join(p.read_text('ascii').split())
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          names=set()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              items=archive.getmembers()
              assert len(items)==31, f'Expected 31 source files, got {len(items)}'
              for item in items:
                  name=PurePosixPath(item.name)
                  assert item.isfile() and not name.is_absolute() and '..' not in name.parts
                  assert str(name) not in names and name.parts[0]!='.bootstrap'
                  assert not str(name).startswith('bridge/'), 'Unexpected bridge file'
                  assert not str(name).startswith('.env'), 'Potential credential file'
                  names.add(str(name))
                  dest=Path(str(name))
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(archive.extractfile(item).read())
          p.unlink()
          Path('.github/workflows/import-clean-source.yml').unlink()
          Path('.bootstrap').rmdir()
          print(f'IMPORTED_FILES={len(names)}')
          PYCODE
      - name: Commit source and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import cleaned OneShot application source, tests, and gitignore"
            git push origin HEAD:main
          fi
