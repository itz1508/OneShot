name: TaskTodo format diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --extra meta
      - run: uv run --no-sync ruff format --diff agent/contracts/task_todo.py agent/runtime/build_todos.py tests/contracts/test_task_todo_compile.py
