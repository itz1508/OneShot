<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneShot</title>
<style>
:root{--bg:#060a18;--bg2:#0b1226;--panel:#101a36;--edge:#27407a;--text:#eaf2ff;--sub:#9fb2d8;--cyan:#52dcff;--good:#5df0b4;--warn:#ffc46b;--bad:#ff7d8d;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1100px 560px at 75% -10%,#1a2a6a55,transparent),var(--bg);color:var(--text);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #ffffff12}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:17px}
.mark{width:22px;height:22px;border-radius:50%;border:3px solid var(--cyan);box-shadow:0 0 12px var(--cyan)}
.conn{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--sub);font-size:13px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.conn[data-ok=true] i{background:var(--good);box-shadow:0 0 8px var(--good)}.conn[data-ok=false] i{background:var(--bad)}
.ghost{background:none;border:1px solid #ffffff24;border-radius:10px;padding:6px 11px;display:inline-flex;align-items:center;gap:7px;color:var(--sub)}
.ghost:hover{color:var(--text);border-color:var(--cyan)}
main{flex:1;overflow:auto;padding:24px 20px}
#feed{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.msg{max-width:90%}.msg p{margin:0}
.msg.user{align-self:flex-end;background:#1a2a5c;border:1px solid var(--edge);border-radius:16px 16px 4px 16px;padding:10px 14px}
.msg.agent{align-self:flex-start;background:var(--panel);border:1px solid #ffffff16;border-radius:16px 16px 16px 4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg.warn{border-color:#ff7d8d66}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--sub);padding:36px 0}
.empty h1{margin:0;color:var(--text);font-size:22px;font-weight:600}.empty .bot{width:120px}
.ic{display:inline-grid;place-items:center;width:20px;height:20px;flex:none}.ic svg{width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:#ffffff0f;border:1px solid #ffffff1c;font-size:12.5px;color:var(--text)}
.chip .ic{width:15px;height:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts .ghost{color:var(--text);border-color:var(--edge)}
.s-high{color:var(--bad)}.s-medium{color:var(--warn)}.s-low{color:var(--sub)}
.stagewrap{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;max-height:720px;overflow:hidden}
.stagewrap.out{animation:out .55s ease-in forwards}@keyframes out{to{opacity:0;transform:scale(.7);max-height:0}}
.bot{width:150px;flex:none}.bot svg{width:100%;height:auto;overflow:visible}
.bot .head{fill:#e9f1ff}.bot .ear{fill:#7e8dff}.bot .visor{fill:#0a1228}.bot .eye{fill:var(--cyan)}.bot .body{fill:#cfdcff}
.bot .ant line{stroke:#cfdcff;stroke-width:3;stroke-linecap:round}.bot .tip{fill:var(--cyan)}
.bot .smile{fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;opacity:0}
.bot[data-state=work] .eyes{animation:scan 1.1s ease-in-out infinite}.bot[data-state=work] .tip{animation:pulse 1s infinite}.bot[data-state=work] svg{animation:bob 1.4s ease-in-out infinite}
.bot[data-state=done] .eye{fill:var(--good);transform:scaleY(.3);transform-box:fill-box;transform-origin:center}.bot[data-state=done] .smile{opacity:1}
.bot[data-state=err] .eye,.bot[data-state=err] .tip{fill:var(--bad)}

.screen{position:relative;aspect-ratio:1;width:min(100%,360px);background:linear-gradient(160deg,#0f1b40,#0a1330);border:1px solid var(--edge);border-radius:22px;box-shadow:0 0 0 6px var(--bg2),0 0 44px #52dcff24,inset 0 0 40px #52dcff10;display:flex;flex-direction:column;padding:14px;overflow:hidden}
.screen[data-s=work]::after{content:"";position:absolute;left:0;right:0;top:-70px;height:70px;background:linear-gradient(transparent,#52dcff26,transparent);animation:sweep 2.4s linear infinite;pointer-events:none}
@keyframes sweep{to{transform:translateY(470px)}}
.bar{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.live{display:flex;align-items:center;gap:7px}.live i{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:pulse 1.2s infinite}
.screen[data-s=done] .live i{background:var(--good);animation:none}.screen[data-s=err] .live i{background:var(--bad);animation:none}
.stack{flex:1;min-height:0;display:flex;flex-direction:column;margin:12px 0 8px}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;border-radius:12px 12px 0 0;background:#14275a;border:1px solid #ffffff14;font-size:13px;color:var(--sub);margin-bottom:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.p1{width:93%;align-self:center;opacity:.8}.pill.p2{width:86%;align-self:center;opacity:.5}
.front{flex:1;min-height:0;position:relative;z-index:1;background:linear-gradient(180deg,#1b2f6a,#12214e);border:1px solid var(--edge);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.front.fresh{animation:lift .4s}@keyframes lift{from{transform:translateY(14px);opacity:.3}}
.big{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#52dcff1c;border:1px solid #52dcff55;color:var(--cyan);box-shadow:0 0 18px #52dcff33}.big .ic{width:26px;height:26px}
.front .t{font-size:18px;font-weight:600;margin-top:4px}.front .s{color:var(--sub);font-size:13.5px}
.screen[data-s=done] .big{color:var(--good);border-color:#5df0b466;background:#5df0b41a}.screen[data-s=err] .big{color:var(--bad);border-color:#ff7d8d66;background:#ff7d8d1a}
.steps-btn{width:100%;justify-content:space-between}.steps-btn .chev{transition:transform .2s}.steps-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.steplist{position:absolute;z-index:3;left:14px;right:14px;top:44px;bottom:60px;margin:0;padding:8px;list-style:none;overflow:auto;background:#0b1538f2;border:1px solid var(--edge);border-radius:14px}
.steplist li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}.steplist li+li{border-top:1px solid #ffffff10}
form{border-top:1px solid #ffffff12;padding:12px 20px;background:var(--bg2)}
.box{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:8px 8px 8px 14px}
textarea{flex:1;background:none;border:0;color:inherit;font:inherit;resize:none;outline:0;max-height:140px;padding:6px 0}
.send{width:38px;height:38px;border-radius:12px;border:0;background:var(--cyan);color:#04101f;display:grid;place-items:center}.send:disabled{opacity:.35;cursor:default}
#scrim{position:fixed;inset:0;background:#020610a0;z-index:20;display:none}#scrim.on{display:block}
#drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(450px,100%);background:var(--bg2);border-left:1px solid var(--edge);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .3s,visibility 0s .3s}
#drawer.open{transform:none;visibility:visible;transition:transform .3s}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #ffffff12}.dh h2{margin:0;font-size:18px}
.db{flex:1;overflow:auto;padding:14px 18px 28px}
.tools{display:flex;align-items:center;gap:10px;margin-bottom:6px;color:var(--sub);font-size:13px}
select{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:10px;padding:6px 10px;font:inherit}
details.f{border:1px solid #ffffff1a;border-radius:12px;background:var(--panel);margin:8px 0}
details.f>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}details.f>summary::-webkit-details-marker{display:none}
details.f>summary .t{flex:1}details.f .chev{transition:transform .2s}details.f[open] .chev{transform:rotate(180deg)}
.fb{padding:0 14px 12px 42px;color:var(--sub);display:flex;flex-direction:column;gap:8px}.fb code{font:12.5px Consolas,"Cascadia Code",monospace;color:var(--text)}
.where{display:flex;align-items:center;gap:7px}.sec{margin-top:18px}.sec>summary{font-weight:600}
@media (max-width:640px){#drawer{top:auto;height:84%;width:100%;border-left:0;border-top:1px solid var(--edge);border-radius:18px 18px 0 0;transform:translateY(100%)}.bot{width:96px}}
@media (prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style></head><body>
