[project]
name = "rsm"
version = "0.0.0"
description = "RSM V1 — Reference Source Material authoritative daemon."
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard] >= 0.142",
  "pydantic >= 2.13",
  "pymupdf >= 1.28",
  "mcp >= 2.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
