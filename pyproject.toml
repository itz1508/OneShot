[project]
name = "oneshot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mvp", "api_fundamentals"]

[project.optional-dependencies]
meta = ["openai>=1.0"]
claude = ["claude-agent-sdk"]
codex = ["openai-codex"]
mvp = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=2,<3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "deptry>=0.20",
    "httpx>=0.27,<1",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B017", "S101", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.deptry]
known_first_party = ["agent", "mvp", "api_fundamentals"]
extend_exclude = ["deployment/modal"]

[tool.deptry.per_rule_ignores]
DEP001 = ["modal"]
DEP002 = ["claude-agent-sdk", "openai-codex", "uvicorn"]
