[tool.uv.workspace]
members = ["oneshot/backend", "oneshot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# per-app pytest configs live in oneshot/*/pyproject.toml;
# this root key is for the workspace contract tests under oneshot/tests/.
testpaths = ["oneshot/tests"]
asyncio_mode = "auto"
