[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneshot"
version = "0.5.0"
description = "OneShot greenfield local scanner, durable task context, MCP and bounded build"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "mcp>=1.30,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oneshot-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["input", "output", "templates"]
namespaces = true

[tool.setuptools]
py-modules = ["scanner", "task", "build", "mcp_server", "workflow_templates"]

[tool.setuptools.package-data]
output = ["schema/*.json"]
templates = ["*.md", "catalog.json", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
