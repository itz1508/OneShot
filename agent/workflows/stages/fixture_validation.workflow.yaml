id: fixture_validation
stage: fixture_validation
version: 1
# ============================================================
# Fixture Validator workflow
# ============================================================

workflow:
  stage_id: fixture_validation
  role_id: fixture_validator
  executor_id: fixture_validator_executor
  stage_revision_source: host_controller

  purpose:
    summary: >-
      Execute the fixture definitions associated with the exact frozen
      BuildSpecification and record independent observed results.

  success_contract:
    derived_from: accepted_user_intent_and_supplied_criteria
    success_meaning: Establish the readiness of the exact frozen specification through observed isolated
      fixture outcomes, including failures and interruption cases, without altering the plan.
    observable_conditions:
      - fixture_checks_executed_or_explicitly_unavailable
      - observed_evidence_retained
      - no_plan_mutation
    criteria_completeness_gate: false
  request_result_exchange:
    mode: bidirectional_request_result
    receives_from: host_frozen_specification
    returns_result_to: host_build_admission
    routing_authority: host_controller
    prohibits:
      - plan_revision
      - self_admission
    input_request_ref_source: host_request_router
  input_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: fixture input request/result contract
    type: object
    additionalProperties: false
    required:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - frozen_specification_ref
      - freeze_receipt_ref
      - fixture_definition_refs
      - sandbox_profile_ref
    properties:
      request_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      request_revision:
        type: integer
        minimum: 1
      task_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      user_intent_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      frozen_specification_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      freeze_receipt_ref:
        $ref: urn:oneshot:contract:receipt_ref:1.0
      fixture_definition_refs:
        type: array
        items:
          $ref: urn:oneshot:contract:artifact_ref:1.0
        minItems: 1
      sandbox_profile_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
  output_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: fixture output request/result contract
    type: object
    additionalProperties: false
    required:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - status
      - input_request_ref
    properties:
      request_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      request_revision:
        type: integer
        minimum: 1
      task_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      user_intent_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      status:
        type: string
        enum:
          - completed
          - failed
          - blocked
          - not_run
          - skipped
      unresolved:
        type: array
        items:
          type: string
      fixture_validation_record_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      fixture_observations:
        type: array
        items:
          type: object
      command_result_refs:
        type: array
        items:
          $ref: urn:oneshot:contract:artifact_ref:1.0
      limitations:
        type: array
        items:
          type: string
      input_request_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
    allOf:
      - if:
          required:
            - status
          properties:
            status:
              const: completed
        then:
          required:
            - fixture_validation_record_ref
            - fixture_observations
  schema_validation:
    validator_owner: host
    dialect: json_schema_2020_12
    external_contract_refs: resolve_from_registered_contracts
    unresolved_external_ref: reject
    exact_request_revision_binding: true
    user_intent_binding_required: true
    receipt_authority: trusted_host_only
    validate_before_persistence: true
    validate_after_reopen: true
    failure_output_policy: return_bound_blocked_result_without_fabricated_stage_artifacts
    cross_reference_validation:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - parent_artifact_revision
      - receipt_subject_and_issuer
    require_output_input_request_ref_match: true
  inputs:
    required:
      - input_id: input_request
        contract_id: fixture_validation_input_request
        schema_source: workflow.input_schema
        resolution: host_bound_request_artifact
        source: host_request_router
        receipt_required: true
      - input_id: frozen_specification
        contract_id: build_specification
        resolution: exact_artifact_ref
        receipt_required: true

      - input_id: freeze_receipt
        contract_id: receipt_ref
        resolution: exact_receipt_ref

      - input_id: fixture_definitions
        contract_id: fixture_definition
        resolution: exact_artifact_ref
        multiple: true

      - input_id: tool_registry_snapshot
        contract_id: tool_registry_snapshot
        resolution: exact_artifact_ref

      - input_id: sandbox_profile_registry_snapshot
        contract_id: sandbox_profile_registry_snapshot
        resolution: exact_artifact_ref

      - input_id: sandbox_profile
        contract_id: sandbox_profile
        resolution: host_selected_registered_profile
        source: host
  execution:
    provider_session_required: true

    model_loop:
      enabled: true
      maximum_tool_calls: 100
      maximum_fixture_attempts: 3
      completion_condition: fixture_validation_output_submitted

    sandbox:
      creation_owner: host
      profile_resolution_owner: host
      source_snapshot_owner: host
      network_policy_source: sandbox_profile_registry

    required_work:
      - step_id: load_frozen_inputs
        produces:
          - frozen_fixture_scope

      - step_id: resolve_fixture_tools
        produces:
          - resolved_fixture_invocations

      - step_id: create_fixture_environment
        produces:
          - fixture_sandbox_handle

      - step_id: execute_fixtures
        produces:
          - fixture_observations
          - command_results

      - step_id: assess_validity
        produces:
          - fixture_validity_results

      - step_id: submit_fixture_record
        produces:
          - fixture_validation_record_candidate

  tool_projection:
    registry_ref_source: package_lock

    capabilities:
      - capability_id: artifacts.get_artifact
        wire_name: get_artifact
        permission_token: artifacts.read

      - capability_id: repository.list_files
        wire_name: list_files
        permission_token: repository.read

      - capability_id: repository.read_file
        wire_name: read_file
        permission_token: repository.read

      - capability_id: repository.search_files
        wire_name: search_files
        permission_token: repository.search

      - capability_id: sandbox.run_registered
        wire_name: run_in_sandbox
        permission_token: sandbox.execute_registered
        availability: admitted_profile_only

    command_policy:
      raw_argv_allowed: false
      registered_tool_invocations_only: true
      effect_time_resolution_required: true

  outputs:
    - output_slot: primary
      contract_id: fixture_validation_record
      contract_version: "1.0"
      media_type: application/json

      required_sections:
        - frozen_specification_ref
        - fixture_definition_refs
        - sandbox_profile_ref
        - observations
        - validity_results
        - command_result_refs
        - evidence_refs
        - unresolved
        - limitations

  persistence:
    temporary_output:
      allocation_owner: host
      runtime_root_source: runtime_root_registry
      filename_generation: host_generated

    authoritative_output:
      owner: host
      backend: artifact_store
      immutable: true
      reopen_after_persist: true
      verify_digest_after_reopen: true

  completion:
    receipt:
      issuer: host
      subject_contract_id: fixture_validation_completion_subject
      subject_contract_version: "1.0"

      binds:
        - workspace_id
        - task_id
        - run_id
        - stage_revision
        - frozen_specification_ref
        - fixture_definition_refs
        - fixture_validation_record_ref
        - sandbox_profile_ref
        - tool_registry_ref

        - input_request_ref
    host_completion_rule: persist_reopen_validate_exact_output_then_issue_trusted_receipt
  handoff:
    target_stage: package_lock
    contract_id: fixture_package_lock_handoff
    contract_version: "1.0"

    required_refs:
      - input_request_ref
      - frozen_specification_ref
      - freeze_receipt_ref
      - fixture_validation_record_ref
      - fixture_validation_receipt_ref
      - tool_registry_ref
      - sandbox_profile_registry_ref

    transition_owner: host_controller

  checkpoints:
    - checkpoint_id: fixture_entry
      resume_point: load_frozen_inputs

    - checkpoint_id: fixture_sandbox_created
      resume_point: execute_fixtures

    - checkpoint_id: fixture_results_persisted
      resume_point: issue_completion_receipt

    - checkpoint_id: fixture_handoff_ready
      resume_point: host_create_package_lock

  recovery:
    inspect:
      - sandbox_state
      - command_results
      - fixture_observations
      - fixture_validation_record
      - completion_receipt
      - lifecycle_events

    classifications:
      - not_started
      - sandbox_created
      - execution_in_progress
      - observations_persisted
      - output_persisted
      - receipt_issued
      - handoff_ready
      - completed
      - uncertainty

  cleanup:
    after_successful_handoff:
      delete:
        - temporary_fixture_workspace
        - temporary_command_output
        - temporary_rendered_reports

      retain:
        - fixture_validation_record
        - command_result_artifacts
        - evidence_artifacts
        - completion_receipt
        - material_checkpoints
