id: build
stage: build
version: 1
# ============================================================
# Builder workflow
# ============================================================

workflow:
  stage_id: build
  role_id: builder
  executor_id: builder_executor
  stage_revision_source: host_controller

  purpose:
    summary: >-
      Execute only the frozen and admitted BuildTask in the host sandbox. Produce effects and evidence; never
      choose architecture, expand file scope, or redefine the approved work.

  success_contract:
    derived_from: accepted_user_intent_and_supplied_criteria
    success_meaning: Perform only admitted actions against the approved source snapshot, record actual 
      effects and failed or uncertain operations, and stop at the admitted task boundary. The Builder 
      does not decide whether user acceptance criteria passed.
    observable_conditions:
      - every_admitted_action_accounted_for
      - effect_reconciliation_complete_or_explicitly_blocked
      - no_scope_expansion
      - no_design_decisions
    criteria_completeness_gate: false
  request_result_exchange:
    mode: bidirectional_request_result
    receives_from: planning_via_host_admission
    returns_result_to: planning_parent_via_host_task_integration
    feedback_when_blocked: host_routes_contradiction_to_planning
    routing_authority: host_controller
    prohibits:
      - research_request
      - new_design
      - scope_expansion
      - new_dependencies
      - self_authorization
    build_admission_precedes_execution: true
    parallel_batch_rule: disjoint_paths_and_no_unresolved_dependencies_within_each_parallel_wave
    dependency_waves: ordered_barrier_verified_by_host
    move_action: single_admitted_action_declaring_source_and_destination
    preflight_and_effect_gate: host_owned
    input_request_ref_source: host_request_router
  input_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: build input request/result contract
    type: object
    additionalProperties: false
    required:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - frozen_specification_ref
      - build_task_ref
      - build_admission_ref
      - preflight_result_ref
      - source_snapshot_ref
      - sandbox_handle
      - authorized_action_ids
    properties:
      request_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      request_revision:
        type: integer
        minimum: 1
      task_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      user_intent_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      frozen_specification_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      build_task_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      build_admission_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      preflight_result_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      source_snapshot_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      sandbox_handle:
        type: string
        minLength: 1
      authorized_action_ids:
        type: array
        items:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        minItems: 1
  output_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: build output request/result contract
    type: object
    additionalProperties: false
    required:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - status
      - input_request_ref
    properties:
      request_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      request_revision:
        type: integer
        minimum: 1
      task_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      user_intent_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      status:
        type: string
        enum:
          - completed
          - failed
          - blocked
          - not_run
          - skipped
      unresolved:
        type: array
        items:
          type: string
      build_attempt_result_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      changed_paths:
        type: array
        items:
          type: string
      effect_receipt_refs:
        type: array
        items:
          $ref: urn:oneshot:contract:receipt_ref:1.0
      unresolved_effects:
        type: array
        items:
          type: string
      operation_id:
        type: string
        minLength: 1
      effect_reconciled:
        type: boolean
      input_request_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
    allOf:
      - if:
          required:
            - status
          properties:
            status:
              const: completed
        then:
          required:
            - build_attempt_result_ref
            - operation_id
            - effect_reconciled
            - unresolved_effects
      - if:
          required:
            - status
          properties:
            status:
              const: completed
        then:
          properties:
            effect_reconciled:
              const: true
            unresolved_effects:
              maxItems: 0
  schema_validation:
    validator_owner: host
    dialect: json_schema_2020_12
    external_contract_refs: resolve_from_registered_contracts
    unresolved_external_ref: reject
    exact_request_revision_binding: true
    user_intent_binding_required: true
    receipt_authority: trusted_host_only
    validate_before_persistence: true
    validate_after_reopen: true
    failure_output_policy: return_bound_blocked_result_without_fabricated_stage_artifacts
    cross_reference_validation:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - parent_artifact_revision
      - receipt_subject_and_issuer
    require_output_input_request_ref_match: true
  inputs:
    required:
      - input_id: input_request
        contract_id: build_input_request
        schema_source: workflow.input_schema
        resolution: host_bound_request_artifact
        source: host_request_router
        receipt_required: true
      - input_id: frozen_specification
        contract_id: build_specification
        resolution: exact_artifact_ref
        receipt_required: true

      - input_id: build_task_set
        contract_id: build_task_set
        resolution: exact_artifact_ref

      - input_id: build_task
        contract_id: build_task
        resolution: exact_artifact_ref

      - input_id: build_admission
        contract_id: build_admission
        resolution: exact_artifact_ref
        receipt_required: true

      - input_id: build_preflight_result
        contract_id: build_preflight_result
        resolution: exact_artifact_ref
        receipt_required: true

      - input_id: source_snapshot
        contract_id: source_snapshot
        resolution: exact_artifact_ref

      - input_id: tool_registry_snapshot
        contract_id: tool_registry_snapshot
        resolution: exact_artifact_ref

      - input_id: sandbox_profile
        contract_id: sandbox_profile
        resolution: exact_artifact_ref

      - input_id: sandbox_handle
        contract_id: sandbox_handle
        resolution: opaque_host_handle

  execution:
    provider_session_required: true

    model_loop:
      enabled: true
      maximum_tool_calls: 120
      maximum_candidate_attempts: 5
      completion_condition: build_attempt_result_submitted

    attempt_identity:
      task_revision_source: build_task
      attempt_id_source: host_attempt_manager
      operation_id_source: host_operation_manager

    required_work:
      - step_id: load_task
        produces:
          - task_objective
          - authorized_paths
          - expected_preimages
          - required_verification
          - expected_result

      - step_id: inspect_task_source
        produces:
          - implementation_context

      - step_id: produce_candidate
        produces:
          - builder_candidate

      - step_id: submit_candidate_for_execution
        produces:
          - candidate_execution_request

      - step_id: observe_execution
        produces:
          - changed_paths
          - change_manifest
          - operation_evidence

      - step_id: request_focused_verification
        produces:
          - focused_command_results

      - step_id: refine_candidate
        condition: focused_verification_invalid_and_changes_remain_within_admitted_task
        produces:
          - next_candidate_attempt

        scope_rule: implementation_correction_only_no_new_paths_dependencies_or_acceptance_criteria
        on_scope_contradiction: stop_and_report_to_host_for_planning
      - step_id: request_broader_verification
        condition: focused_verification_valid
        produces:
          - broader_command_results

      - step_id: submit_attempt_result
        produces:
          - build_attempt_result_candidate

  tool_projection:
    registry_ref_source: package_lock

    capabilities:
      - capability_id: artifacts.get_artifact
        wire_name: get_artifact
        permission_token: artifacts.read

      - capability_id: repository.list_files
        wire_name: list_files
        permission_token: task_repository.read

      - capability_id: repository.read_file
        wire_name: read_file
        permission_token: task_repository.read

      - capability_id: repository.search_files
        wire_name: search_files
        permission_token: task_repository.search

      - capability_id: builder.submit_candidate
        wire_name: submit_candidate
        permission_token: builder.candidate_submit

      - capability_id: sandbox.run_registered
        wire_name: run_registered_tool
        permission_token: task_tool.execute

      - capability_id: task_management.get_status
        wire_name: get_task_status
        permission_token: task_management.read

    scope_binding:
      task_ref_source: active_build_task
      authorized_paths_source: active_build_task
      authorized_tool_ids_source: build_admission
      sandbox_handle_source: host
      physical_root_model_selectable: false

    command_policy:
      raw_argv_allowed: false
      command_profile_source: frozen_build_task
      effect_time_resolution_required: true
      output_evidence_required: true

  candidate_contract:
    contract_id: builder_candidate
    contract_version: "1.0"

    implementation_kinds:
      - patch
      - file_operations

    required_fields:
      - task_id
      - task_revision
      - attempt_id
      - declared_paths
      - implementation_kind
      - implementation_summary

      - input_request_ref
  outputs:
    - output_slot: primary
      contract_id: build_attempt_result
      contract_version: "1.0"
      media_type: application/json

      required_sections:
        - task_id
        - task_revision
        - attempt_id
        - operation_id
        - source_snapshot_digest
        - resulting_snapshot_digest
        - changed_paths
        - change_manifest_ref
        - focused_result_refs
        - broader_result_refs
        - patch_ref
        - evidence_bundle_ref
        - effect_reconciled
        - unresolved_effects
        - execution_status
        - diagnostic_status

        - input_request_ref
  persistence:
    candidate_artifacts:
      backend: artifact_store
      authority: candidate_only

    command_results:
      backend: evidence_store
      bounded_output: true

    attempt_result:
      owner: host
      backend: artifact_store
      immutable: true
      reopen_after_persist: true
      verify_digest_after_reopen: true

  completion:
    candidate_result:
      submitted_to: host_task_integrator

    acceptance_owner: host
    verification_owner: host_task_verifier

    host_completion_rule: persist_reopen_validate_exact_output_then_issue_trusted_receipt
  handoff:
    target_stage: task_integration
    contract_id: builder_task_integration_handoff
    contract_version: "1.0"

    required_refs:
      - input_request_ref
      - build_task_ref
      - build_preflight_result_ref
      - accepted_candidate_ref
      - build_attempt_result_ref
      - change_manifest_ref
      - patch_ref
      - evidence_bundle_ref

    transition_owner: host_controller

    feedback_request_path: return_blocked_attempt_to_host_for_planning_revision
  checkpoints:
    - checkpoint_id: builder_task_loaded
      resume_point: produce_candidate

    - checkpoint_id: builder_candidate_submitted
      resume_point: host_pre_effect

    - checkpoint_id: builder_post_effect_observed
      resume_point: request_focused_verification

    - checkpoint_id: builder_verification_complete
      resume_point: submit_attempt_result

    - checkpoint_id: builder_handoff_ready
      resume_point: host_task_integration

  recovery:
    inspect:
      - prior_attempt_record
      - sandbox_state
      - source_snapshot
      - candidate_artifact
      - changed_path_manifest
      - command_results
      - effect_checkpoint
      - evidence_bundle

    classifications:
      - not_started
      - candidate_created
      - candidate_submitted
      - effect_started
      - effect_uncertain
      - effect_reconciled
      - verification_in_progress
      - result_submitted
      - completed

  cleanup:
    after_host_acceptance:
      delete:
        - temporary_candidate_files
        - temporary_command_workspaces
        - transient_model_drafts
        - duplicate_patch_projections

      retain:
        - accepted_candidate
        - build_attempt_result
        - change_manifest
        - patch_artifact
        - command_result_artifacts
        - evidence_bundle
        - material_checkpoints
