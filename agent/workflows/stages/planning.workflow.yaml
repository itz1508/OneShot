id: planning
stage: planning
version: 1
# ============================================================
# Planner workflow
# ============================================================

workflow:
  stage_id: planning
  role_id: planner
  executor_id: planner_executor
  stage_revision_source: host_controller

  purpose:
    summary: >-
      Convert accepted Research and Audit Discovery artifacts into a complete,
      traceable, executable candidate BuildSpecification.

  success_contract:
    derived_from: accepted_user_intent_and_supplied_criteria
    success_meaning: Resolve implementation decisions needed to satisfy accepted user intent; produce an
      executable candidate specification that requires no architecture decisions during Build, or 
      explicitly record that no Build is required.
    observable_conditions:
      - every_code_intent_dispositioned
      - actions_paths_dependencies_and_verification_defined_if_build_needed
      - candidate_reopened_and_checked
      - no_production_effects
    criteria_completeness_gate: false
  request_result_exchange:
    mode: bidirectional_request_result
    receives_from:
      - audit_discovery
      - research
    may_request_information_from:
      - research
      - audit_discovery
    produces_candidate_for: host_scanner
    build_parent: planning
    routing_authority: host_controller
    prohibits:
      - production_effects
      - self_freeze
      - self_admission
    input_request_ref_source: host_request_router
  input_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: planning input request/result contract
    type: object
    additionalProperties: false
    required:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - research_output_ref
      - research_receipt_ref
      - audit_output_ref
      - audit_receipt_ref
      - source_checkpoint_ref
    properties:
      request_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      request_revision:
        type: integer
        minimum: 1
      task_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      user_intent_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      research_output_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      research_receipt_ref:
        $ref: urn:oneshot:contract:receipt_ref:1.0
      audit_output_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      audit_receipt_ref:
        $ref: urn:oneshot:contract:receipt_ref:1.0
      source_checkpoint_ref:
        $ref: urn:oneshot:contract:source_checkpoint:1.0
      planning_objective:
        type: string
        minLength: 1
  output_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    title: planning output request/result contract
    type: object
    additionalProperties: false
    required:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - status
      - input_request_ref
    properties:
      request_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      request_revision:
        type: integer
        minimum: 1
      task_id:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      user_intent_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      status:
        type: string
        enum:
          - completed
          - failed
          - blocked
          - not_run
          - skipped
      unresolved:
        type: array
        items:
          type: string
      planning_record_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      candidate_specification_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
      intent_reviews:
        type: array
        items:
          type: object
      no_build_required:
        type: boolean
      limitations:
        type: array
        items:
          type: string
      input_request_ref:
        $ref: urn:oneshot:contract:artifact_ref:1.0
    allOf:
      - if:
          required:
            - status
          properties:
            status:
              const: completed
        then:
          required:
            - planning_record_ref
            - intent_reviews
            - no_build_required
      - if:
          required:
            - status
            - no_build_required
          properties:
            status:
              const: completed
            no_build_required:
              const: true
        then:
          not:
            required:
              - candidate_specification_ref
      - if:
          required:
            - status
            - no_build_required
          properties:
            status:
              const: completed
            no_build_required:
              const: false
        then:
          required:
            - candidate_specification_ref
  schema_validation:
    validator_owner: host
    dialect: json_schema_2020_12
    external_contract_refs: resolve_from_registered_contracts
    unresolved_external_ref: reject
    exact_request_revision_binding: true
    user_intent_binding_required: true
    receipt_authority: trusted_host_only
    validate_before_persistence: true
    validate_after_reopen: true
    failure_output_policy: return_bound_blocked_result_without_fabricated_stage_artifacts
    cross_reference_validation:
      - request_id
      - request_revision
      - task_id
      - user_intent_ref
      - parent_artifact_revision
      - receipt_subject_and_issuer
    require_output_input_request_ref_match: true
  inputs:
    required:
      - input_id: input_request
        contract_id: planning_input_request
        schema_source: workflow.input_schema
        resolution: host_bound_request_artifact
        source: host_request_router
        receipt_required: true
      - input_id: workflow_input
        contract_id: workflow_input
        resolution: exact_artifact_ref

      - input_id: research_record
        contract_id: research_record
        resolution: exact_artifact_ref
        receipt_required: true

      - input_id: audit_discovery_record
        contract_id: audit_discovery_record
        resolution: exact_artifact_ref
        receipt_required: true

      - input_id: research_completion_receipt
        contract_id: receipt_ref
        resolution: exact_receipt_ref

      - input_id: audit_completion_receipt
        contract_id: receipt_ref
        resolution: exact_receipt_ref

      - input_id: source_checkpoint
        contract_id: source_checkpoint
        resolution: exact_artifact_ref

    optional:
      - input_id: catalog_match
        contract_id: catalog_match
        resolution: exact_artifact_ref

      - input_id: research_preparation
        contract_id: research_preparation
        resolution: exact_artifact_ref

  execution:
    provider_session_required: true

    model_loop:
      enabled: true
      maximum_tool_calls: 160
      maximum_candidate_revisions: 5
      completion_condition: planning_outputs_submitted

    required_work:
      - step_id: load_upstream
        produces:
          - accepted_requirements
          - evidence_findings
          - audit_findings
          - code_intents

      - step_id: review_code_intents
        produces:
          - code_intent_reviews

      - step_id: record_planning_issues
        produces:
          - planning_issues

      - step_id: make_design_decisions
        produces:
          - design_decisions

      - step_id: define_corrective_refactors
        produces:
          - corrective_refactors

      - step_id: define_build_actions
        produces:
          - build_actions
          - action_dependencies
          - path_preconditions
          - expected_results

      - step_id: define_verification
        produces:
          - tool_invocations
          - requirement_coverage
          - criterion_coverage
          - recovery_requirements

      - step_id: persist_candidate
        produces:
          - candidate_build_specification

      - step_id: persist_planning_record
        produces:
          - planning_record

      - step_id: resolve_candidate_against_registries
        produces:
          - registry_resolution_result

      - step_id: request_scanner
        produces:
          - scanner_request

  tool_projection:
    registry_ref_source: active_tool_registry_snapshot

    capabilities:
      - capability_id: repository.list_files
        wire_name: list_files
        permission_token: repository.read

      - capability_id: repository.read_file
        wire_name: read_file
        permission_token: repository.read

      - capability_id: repository.search_files
        wire_name: search_files
        permission_token: repository.search

      - capability_id: repository.git_diff
        wire_name: git_diff
        permission_token: repository.git_read

      - capability_id: repository.git_log
        wire_name: git_log
        permission_token: repository.git_read

      - capability_id: artifacts.get_artifact
        wire_name: get_artifact
        permission_token: artifacts.read

      - capability_id: artifacts.submit_candidate
        wire_name: submit_artifact
        permission_token: artifacts.submit_candidate

      - capability_id: artifacts.validate_candidate
        wire_name: validate_artifact
        permission_token: artifacts.validate

      - capability_id: scanner.request_scan
        wire_name: request_scan
        permission_token: scanner.request

      - capability_id: scanner.get_result
        wire_name: get_scan_result
        permission_token: scanner.read

      - capability_id: scanner.cancel_request
        wire_name: cancel_scan
        permission_token: scanner.cancel

      - capability_id: task_management.get_status
        wire_name: get_task_status
        permission_token: task_management.read

    root_binding:
      source: registered_workspace
      model_selectable: false

    result_policy:
      retain_tool_outcome_refs: true
      maximum_model_text_characters: 20000
      persist_truncated_results: true

  tool_invocation_contract:
    registry_ref_source: active_tool_registry_snapshot
    raw_argv_allowed: false

    invocation_fields:
      - registry_ref
      - tool_id
      - tool_version
      - args

    scanner_resolution_required: true

  outputs:
    - output_slot: planning_record
      contract_id: planning_record
      contract_version: "1.0"
      media_type: application/json

      required_sections:
        - workflow_input_ref
        - research_record_ref
        - audit_discovery_record_ref
        - candidate_specification_ref
        - intent_review_ids
        - planning_issue_ids
        - design_decision_ids
        - corrective_refactor_ids
        - unresolved
    - output_slot: candidate_specification
      contract_id: build_specification
      contract_version: "1.0"
      media_type: application/json

      required_sections:
        - specification_id
        - revision
        - workflow_input_ref
        - research_record_ref
        - audit_discovery_record_ref
        - source_checkpoint_ref
        - tool_registry_ref
        - sandbox_profile_registry_ref
        - scanner_check_registry_ref
        - intent_reviews
        - planning_issues
        - design_decisions
        - corrective_refactors
        - actions
        - requirement_coverage
        - criterion_coverage
        - unresolved
        - limitations
      when: build_required
  persistence:
    temporary_output:
      allocation_owner: host
      runtime_root_source: runtime_root_registry
      workflow_stage_source: workflow_registry
      filename_generation: host_generated
      authoritative: false

    authoritative_outputs:
      - output_slot: planning_record
        backend: artifact_store
        immutable: true
        reopen_after_persist: true
        verify_digest_after_reopen: true

      - output_slot: candidate_specification
        backend: artifact_store
        immutable: true
        reopen_after_persist: true
        verify_digest_after_reopen: true

    canonical_serializer_profile: rfc8785-jcs-sha256-v1
    digest_algorithm: sha256

  completion:
    validation:
      every_code_intent_has_disposition: true
      every_action_has_source_intent: true
      every_action_uses_registered_tool_invocations: true
      dependency_graph_acyclic: true
      paths_repository_relative: true
      expected_results_present: true
      verification_present: true
      recovery_requirements_present: true
      persisted_candidate_reopens: true
      persisted_planning_record_reopens: true

      no_build_required_disposition_supported: true
    receipt:
      issuer: host
      subject_contract_id: planning_completion_subject
      subject_contract_version: "1.0"

      binds:
        - workspace_id
        - task_id
        - run_id
        - stage_id
        - stage_revision
        - workflow_input_ref
        - research_record_ref
        - audit_discovery_record_ref
        - planning_record_ref
        - candidate_specification_ref
        - source_checkpoint_ref
        - tool_registry_ref

        - request_id
        - request_revision
        - input_request_ref
    host_completion_rule: persist_reopen_validate_exact_output_then_issue_trusted_receipt
  handoff:
    target_stage: scanner
    contract_id: scanner_request
    contract_version: "1.0"

    required_refs:
      - input_request_ref
      - candidate_specification_ref
      - planning_completion_receipt_ref
      - source_checkpoint_ref
      - tool_registry_ref
      - scanner_check_registry_ref
    transition_owner: host_controller

    when: build_required
    no_build_required_route: host_no_build_completion_review
    feedback_request_path: 
      planning_can_request_more_information_from_research_or_audit_discovery_via_host
  checkpoints:
    - checkpoint_id: planning_entry
      resume_point: load_upstream

    - checkpoint_id: planning_decisions_persisted
      resume_point: define_build_actions

    - checkpoint_id: planning_candidate_persisted
      resume_point: validate_candidate

    - checkpoint_id: planning_record_persisted
      resume_point: issue_completion_receipt

    - checkpoint_id: planning_handoff_ready
      resume_point: host_dispatch_scanner

  recovery:
    inspect:
      - planning_record
      - candidate_specification
      - registry_resolution_result
      - scanner_request
      - completion_receipt
      - lifecycle_events

    classifications:
      - not_started
      - decisions_recorded
      - candidate_submitted
      - candidate_persisted
      - planning_record_persisted
      - receipt_issued
      - scanner_request_ready
      - completed
      - uncertainty

  cleanup:
    after_successful_handoff:
      delete:
        - temporary_planning_drafts
        - duplicate_markdown_projections
        - temporary_candidate_files
        - superseded_unaccepted_candidates

      retain:
        - planning_record
        - accepted_candidate_specification
        - tool_outcome_artifacts
        - completion_receipt
        - scanner_request
        - material_checkpoints
