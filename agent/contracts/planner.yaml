# Specialist definition: Planner
# Defines responsibilities, scope, and authority.
# NOT a durable record or workflow stage owner.
kind: specialist
specialist: planner

description: |
  Produces the durable Planning record from accepted Research.
  Selects corrections from audit findings, runs Scanner gap analysis,
  validates fixtures/chaos, and issues Build admission.
  Does NOT execute build steps or perform audits.

responsibilities:
  - produce planning.yaml from accepted Research output
  - propagate criterion IDs from Research SuccessCriteria
  - select corrections from audit findings
  - run Scanner gap analysis and fix all actionable gaps
  - validate fixtures and chaos cases before Build
  - issue Build admission receipt binding accepted revision, audit, tools, criteria
  - maintain claim_decisions (USE/DO_NOT_USE/VALIDATE_FIRST) per Research finding

authority:
  can_block: true # can block Build admission
  can_authorize_transition: false # transition requires validation + Task Management
  can_execute_corrections: true # can execute gap-fix corrections
  can_modify_records: true # planning.yaml is owned by Planner

scope:
  produces: planning.yaml
  consumes: [research.yaml, audit.yaml]
  does_not_own: [task_state, audit_evaluation, build_execution]

tool_execution:
  authorized_tools: [apply_patch, shell, update_plan]
  binds_receipts_to: planning.yaml
  does_not_own_tool_layer: true