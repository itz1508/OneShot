<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1570" viewBox="0 0 1000 1570" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
<title id="title">OneShot registered workflow, vertical contract view</title>
<desc id="desc">User request flows to six registered role stages: Research, Audit Discovery, Planning, Fixture Validation, Build, and independent Build Validation. The Host owns structural analysis, Scanner, specification freeze, package lock, admission, preflight, sandbox execution, integration, source promotion, and cleanup. Audit Discovery may request additional Research. This is the declared workflow, not evidence of a live end-to-end run.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081523"/><stop offset=".58" stop-color="#0a1b2d"/><stop offset="1" stop-color="#10273b"/></linearGradient><radialGradient id="halo"><stop stop-color="#164e65" stop-opacity=".48"/><stop offset="1" stop-color="#164e65" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="#8bd9e9" stroke-opacity=".045"/><circle cx="1" cy="1" r="1" fill="#9cdff0" opacity=".11"/></pattern><filter id="cardShadow" x="-20%" y="-30%" width="150%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000814" flood-opacity=".48"/></filter><filter id="activeGlow" x="-30%" y="-50%" width="170%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6fe6e9" flood-opacity=".6"/></filter><marker id="downArrow" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6ea4c0" stroke-width="1.7"/></marker><marker id="sideArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#d3aa78" stroke-width="1.6"/></marker></defs>
<rect x="0" y="0" width="1000" height="1570" rx="0" fill="url(#bg)" stroke="none" />
<rect x="0" y="0" width="1000" height="1570" rx="0" fill="url(#grid)" stroke="none" />
<ellipse cx="500" cy="150" rx="540" ry="330" fill="url(#halo)"/>
<text x="72" y="59" fill="#75d9e7" font-size="14" font-weight="800" letter-spacing="2.4">ONESHOT  /  CONTRACT TRACE</text>
<text x="72" y="108" fill="#f5fbff" font-size="36" font-weight="750" >From request to verified change</text>
<text x="72" y="143" fill="#abc5d3" font-size="17" font-weight="500" >Six role stages · Host-owned gates · independent outcome checks</text>
<rect x="770" y="43" width="160" height="35" rx="17" fill="#123345" stroke="#4eafc7" stroke-width="1"/>
<text x="850" y="66" fill="#a6eaf3" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.1">DECLARED FLOW</text>
