<text x="283" y="919" fill="#bed4e0" font-size="16" font-weight="500" >Runs registered fixtures in an isolated environment</text>
<text x="283" y="947" fill="#65cfb5" font-size="13" font-weight="650" letter-spacing=".3">fixture_validation_record  ·  no spec changes</text>
