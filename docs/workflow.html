<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="OneShot intended evidence-driven build workflow and correction routes">
<title>OneShot — Evidence-Driven Workflow</title>
<style>
:root { color-scheme:dark; font-family:"Trebuchet MS", "Aptos", "Segoe UI",sans-serif; background:#071221;color:#f1f7fc;}
*{box-sizing:border-box}
body {margin:0; background:#071221;}
header{max-width:1080px;margin:0 auto; padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{font-size:1rem;letter-spacing:.03em;margin:0;color:#acc2d3;font-weight:500}
.controls{display:flex;gap:8px;align-items:center}
button, .link{appearance:none;border:1px solid #325269;border-radius:10px;background:#102438;padding:8px 14px;color:#e3f4ff;font:600 .88rem inherit; cursor:pointer;text-decoration:none}
button:hover,.link:hover{border-color:#4ad5dd}
button:focus-visible,.link:focus-visible{outline:3px solid #4ad5dd;outline-offset:2px}
main{max-width:1100px;margin:0 auto;}
svg.diagram{display:block;width:100%;height:auto;max-width:1100px; overflow:visible;}
.mono{font-family:"Consolas", "DejaVu Sans Mono", monospace}
.main-edge{stroke:#486982;stroke-width:4;stroke-linecap:round}
.context-edge{stroke:#3b8190;stroke-width:3;stroke-dasharray:12 10}
.return-edge{stroke:#497e97;stroke-width:3;stroke-dasharray:12 10}
.revision-edge{stroke:#a97769;stroke-width:3;stroke-dasharray:12 10}
.prereq-edge{stroke:#8b7955;stroke-width:3;stroke-dasharray:12 10}
.scope-edge{stroke:#407a70;stroke-width:3;stroke-dasharray:12 10}
.main-edge,.context-edge,.return-edge,.revision-edge,.prereq-edge,.scope-edge{animation:travel 3s linear infinite}
@keyframes travel{to{stroke-dashoffset:-88}}
.stage .card{animation:highlight 12s linear infinite;animation-delay:var(--delay)}
.stage .activity{opacity:0;animation:appear 12s linear infinite;animation-delay:var(--delay)}
.stage .accent{opacity:.75}
@keyframes highlight{0%,7%{stroke:var(--tone);stroke-width:4;fill:#173446}10%,100%{stroke:#35556d;stroke-width:2;fill:#101e30}}
@keyframes appear{0%,7%{opacity:1;filter:drop-shadow(0 0 8px var(--tone))}10%,100%{opacity:0}}
.paused .diagram *{animation-play-state:paused!important}
footer{max-width:960px;color:#9bb0c5; font-size:.91rem;line-height:1.5;margin:auto;padding:12px 22px 32px}
footer b{color:#dce8f4}
@media (prefers-reduced-motion:reduce){.diagram *{animation:none!important}.stage .activity{opacity:0}}
</style>
</head>
