[project]
name = "modal-build-sandbox"
version = "0.1.0"
description = "Standalone, host-authorized, patch-first Modal Sandbox executor"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
modal = ["modal>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8", "mypy>=1.13", "modal>=1.1,<2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modal_build_sandbox"]

[project.scripts]
modal-build-sandbox = "modal_build_sandbox.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["tests/fixtures", ".venv"]
markers = ["modal_live: requires actual Modal credentials and a prebuilt image"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
